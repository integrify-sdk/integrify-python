[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "integrify-core"
version = "1.2.1"
description = "Integrify API inteqrasiyalarını rahatlaşdıran bünovrə (core) kitabxanadır."
authors = [{ name = "mmzeynalli", email = "miradil.zeynalli@gmail.com" }]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
classifiers = [
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Typing :: Typed",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Framework :: Pydantic",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["pydantic>=2.11.10,<3", "httpx>=0.27.2,<1"]

[project.urls]
Homepage = "https://integrify.mmzeynalli.dev/"
Repository = "https://github.com/integrify-sdk/integrify-python/tree/main/packages/core"
Documentation = "https://integrify.mmzeynalli.dev/"

[tool.hatch.build.targets.sdist]
include = ["src/integrify"]

[tool.hatch.build.targets.wheel]
include = ["src/integrify"]

[tool.hatch.build.targets.wheel.sources]
"src/integrify" = "integrify"

[tool.hatch.metadata]
allow-namespace-packages = true
